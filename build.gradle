plugins {
    id 'java'
    id 'war'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.eclipse.jetty:jetty-server:11.0.18'
    implementation 'org.eclipse.jetty:jetty-servlet:11.0.18'
    implementation 'org.eclipse.jetty:jetty-webapp:11.0.18'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.eclipse.jetty:jetty-util:11.0.18'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    implementation 'com.google.cloud:google-cloud-aiplatform:3.36.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.21.0'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-api:2.0.7'
}

application {
    mainClass = 'com.recipe.WebServer'
}

run {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.recipe.WebServer'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.recipe.WebServer',
            'Class-Path': '.'
        )
    }
    
    // Include all runtime dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    // Include the static web content
    from('src/main/webapp') {
        into 'static'
    }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    // Exclude problematic signature files
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/main/webapp']
        }
    }
}